# gitleaks config for this repo (also shipped in the public export — the CI gitleaks job
# picks it up automatically). Default rules stay ON; the allowlist below neutralizes the
# known false positives of `generic-api-key`, each provably public:
#   - any 40-hex Ethereum ADDRESS (a public identifier, never a credential): generic-api-key flags
#     these en masse (1036 hits, all addresses, in historical token-list / deployment JSON blobs);
#   - anvil's universally-known deterministic dev-mnemonic private keys (accounts #0-#2),
#     used only against a throwaway local anvil in examples/mm-pusher-ts/demo/anvil-demo.sh.
# The allowlist matches EXACT VALUES (regexTarget = secret), not paths: a real secret added
# to any of these files is still caught.

[extend]
useDefault = true

[allowlist]
description = "Provably-public constants misflagged by generic-api-key"
regexTarget = "secret"
regexes = [
  # Any 40-hex Ethereum ADDRESS is a public identifier, not a credential. Anchored ^…$ so it can never
  # mask a longer high-entropy token; real 64-hex private keys still trip their own specific rules.
  # Subsumes the individual token addresses (cbBTC / USDC) that used to be listed here one by one.
  '''(?i)^0x[0-9a-f]{40}$''',
  # anvil universally-known deterministic dev-mnemonic private keys (accounts #0-#2), throwaway
  # local-only in examples/mm-pusher-ts/demo/anvil-demo.sh (64-hex, so not covered by the address rule).
  '''^0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80$''',
  '''^0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d$''',
  '''^0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a$''',
]
paths = [
  # Removed vendored SDK, history-only (no longer in the tree): generic-api-key flags the ordinary
  # identifier `amount1PerBin` (`targetPerBinToken1 = amount1PerBin;`) as a "key". Not a secret.
  '''^sdk/''',
]
